<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vaquita · Mis cobros</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B4E}a:hover{color:#14503A}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F5F6F2; color: #17201C; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="box-sizing: border-box; padding: 14px 32px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid #D9DDD7; background: #FFFFFF">
    <a href="Grupos.dc.html" style="display: flex; align-items: center; gap: 10px; color: #17201C; text-decoration: none">
      <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="11" fill="#1E6B4E"></rect><path d="M9 11 L18 26 L27 11" fill="none" stroke="#F5F6F2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="25.5" cy="25" r="3.2" fill="#F5F6F2"></circle></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.5px">vaquita</span>
    </a>
    <nav aria-label="Principal" style="display: flex; gap: 4px; flex-wrap: wrap; flex: 1">
      <a href="Grupos.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis suscripciones</a>
      <a href="MisCobros.dc.html" aria-current="page" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; background: #E3F1EA; color: #14503A; font-weight: 700; text-decoration: none">Mis cobros</a>
      <a href="Solicitudes.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis solicitudes</a>
      <a href="Cupos.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Cupos libres</a>
    </nav>
    <a href="Perfil.dc.html" aria-label="Mi perfil: Ana Quispe" style="width: 44px; height: 44px; border-radius: 999px; background: #17201C; color: #F5F6F2; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">AQ</a>
  </header>
  <main style="flex: 1; box-sizing: border-box; width: 100%; max-width: 1080px; margin: 0 auto; padding: 36px 32px 48px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; letter-spacing: -1px">Mis cobros</h1>
      <p style="margin: 0; font-size: 17px; color: #4F5A55">Lo que te toca pagar en cada grupo donde eres miembro.</p>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700">Estado
        <select style="height: 44px; min-width: 180px; border: 1.5px solid #C9CFC8; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF; color: #17201C"><option selected>Todos</option><option>Pendiente</option><option>En revisión</option><option>Pagado</option><option>Atrasado</option><option>Cancelado</option></select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700">Período
        <select style="height: 44px; min-width: 180px; border: 1.5px solid #C9CFC8; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF; color: #17201C"><option selected>Últimos 3 meses</option><option>Octubre 2026</option><option>Septiembre 2026</option></select>
      </label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{charges}}" as="c" hint-placeholder-count="5">
        <a href="{{c.href}}" style="background: #FFFFFF; border: 1px solid #D9DDD7; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; color: #17201C; text-decoration: none">
          <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
            <span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 12px; background: {{c.tile}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">{{c.initial}}</span>
            <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 17px">{{c.group}}</strong><span style="font-size: 15px; color: #4F5A55">{{c.period}} · {{c.due}}</span></div>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">{{c.amount}}</span>
            <span style="min-width: 120px; text-align: center; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; background: {{c.bg}}; color: {{c.fg}}">{{c.status}}</span>
          </div>
          <sc-if value="{{c.hasNote}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 14px; color: #7E1710; background: #FBDCD8; border-radius: 10px; padding: 8px 12px">{{c.note}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = {
      pendiente: { status: 'Pendiente', bg: '#FCEBC7', fg: '#7A4B00' },
      pagado: { status: 'Pagado', bg: '#D7EFE2', fg: '#17573F' },
      atrasado: { status: 'Atrasado', bg: '#FBDCD8', fg: '#9B1C12' }
    };
    return {
      charges: [
        { href: 'Cobro.dc.html', initial: 'S', tile: '#14743A', group: 'Spotify depa', period: 'Octubre 2026', due: 'vence el 21 oct.', amount: 'Bs 19,80', ...st.pendiente, hasNote: false, note: '' },
        { href: '#', initial: 'P', tile: '#1E40AF', group: 'Paramount+ del curso', period: 'Septiembre 2026', due: 'venció el 8 sep.', amount: 'Bs 14,20', ...st.atrasado, hasNote: true, note: 'Ya no perteneces a este grupo. Paga tu deuda para limpiar tu historial.' },
        { href: '#', initial: 'D', tile: '#1D3A8A', group: 'Disney+ primos', period: 'Octubre 2026', due: 'pagado el 13 oct.', amount: 'Bs 22,10', ...st.pagado, hasNote: false, note: '' },
        { href: '#', initial: 'S', tile: '#14743A', group: 'Spotify depa', period: 'Septiembre 2026', due: 'pago de ingreso', amount: 'Bs 19,80', ...st.pagado, hasNote: false, note: '' },
        { href: '#', initial: 'Y', tile: '#5B5F66', group: 'YouTube de la U', period: 'Septiembre 2026', due: 'pagado el 6 sep.', amount: 'Bs 16,40', ...st.pagado, hasNote: false, note: '' }
      ]
    };
  }
}
</script>
</body>
</html>
