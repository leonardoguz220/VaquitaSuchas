<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vaquita · Mis insignias</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B4E}a:hover{color:#14503A}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F5F6F2; color: #17201C; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="box-sizing: border-box; padding: 14px 32px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid #D9DDD7; background: #FFFFFF">
    <a href="Grupos.dc.html" style="display: flex; align-items: center; gap: 10px; color: #17201C; text-decoration: none">
      <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="11" fill="#1E6B4E"></rect><path d="M9 11 L18 26 L27 11" fill="none" stroke="#F5F6F2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="25.5" cy="25" r="3.2" fill="#F5F6F2"></circle></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.5px">vaquita</span>
    </a>
    <nav aria-label="Principal" style="display: flex; gap: 4px; flex-wrap: wrap; flex: 1">
      <a href="Grupos.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis suscripciones</a>
      <a href="MisCobros.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis cobros</a>
      <a href="Solicitudes.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis solicitudes</a>
      <a href="Cupos.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Cupos libres</a>
    </nav>
    <a href="Perfil.dc.html" aria-label="Mi perfil: Ana Quispe" style="width: 44px; height: 44px; border-radius: 999px; background: #1E6B4E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">AQ</a>
  </header>
  <main style="flex: 1; box-sizing: border-box; width: 100%; max-width: 1080px; margin: 0 auto; padding: 36px 32px 48px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
    <nav aria-label="Mi cuenta" style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <a href="Perfil.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis datos</a>
      <a href="Reputacion.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mi reputación</a>
      <a href="Insignias.dc.html" aria-current="page" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; background: #E3F1EA; color: #14503A; font-weight: 700; text-decoration: none">Mis insignias</a>
      <a href="AjustesAvisos.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Avisos</a>
    </nav>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; letter-spacing: -0.8px">Mis insignias</h1>
      <h2 style="margin: 0; font-size: 18px">Obtenidas (3)</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px">
        <sc-for list="{{earned}}" as="b" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border: 1px solid #D9DDD7; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px">
            <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 999px; background: #1E6B4E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">{{b.icon}}</span>
            <strong style="font-size: 16px">{{b.name}}</strong>
            <span style="font-size: 14px; color: #4F5A55">{{b.text}}</span>
            <span style="font-size: 13px; font-weight: 700; color: #17573F">Obtenida el {{b.date}}</span>
          </div>
        </sc-for>
      </div>
      <h2 style="margin: 8px 0 0; font-size: 18px">Por obtener</h2>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{pending}}" as="p" hint-placeholder-count="2">
          <div style="background: #FFFFFF; border: 1px dashed #A9B1AC; border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
            <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 999px; background: #E6E9E4; color: #4F5A55; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">{{p.icon}}</span>
            <div style="flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; gap: 10px"><strong>{{p.name}}</strong><span style="font-size: 14px; font-weight: 700">{{p.progress}}</span></div>
              <div role="progressbar" aria-valuenow="{{p.now}}" aria-valuemin="0" aria-valuemax="{{p.max}}" aria-label="{{p.name}}" style="height: 10px; border-radius: 999px; background: #E6E9E4; overflow: hidden"><div style="width: {{p.pct}}; height: 100%; background: #1E6B4E; border-radius: 999px"></div></div>
              <span style="font-size: 14px; color: #4F5A55">{{p.text}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      earned: [
        { icon: '1', name: 'Primer pago', text: 'Subiste tu primer comprobante a tiempo.', date: '6 mar. 2026' },
        { icon: '3', name: 'Racha de 3', text: '3 pagos puntuales seguidos.', date: '15 may. 2026' },
        { icon: '6', name: 'Racha de 6', text: '6 pagos puntuales seguidos.', date: '8 ago. 2026' }
      ],
      pending: [
        { icon: '12', name: 'Racha de 12', progress: '2 de 12', now: '2', max: '12', pct: '17%', text: 'Tu racha volvió a empezar tras el atraso de septiembre.' },
        { icon: '6m', name: 'Seis meses sin atrasos', progress: '1 de 6 meses', now: '1', max: '6', pct: '17%', text: 'Cuenta desde tu último cobro atrasado.' }
      ]
    };
  }
}
</script>
</body>
</html>
