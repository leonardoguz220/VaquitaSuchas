<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vaquita · Calendario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B4E}a:hover{color:#14503A}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F5F6F2; color: #17201C; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="box-sizing: border-box; padding: 14px 32px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid #D9DDD7; background: #FFFFFF">
    <a href="Grupos.dc.html" style="display: flex; align-items: center; gap: 10px; color: #17201C; text-decoration: none">
      <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="11" fill="#1E6B4E"></rect><path d="M9 11 L18 26 L27 11" fill="none" stroke="#F5F6F2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="25.5" cy="25" r="3.2" fill="#F5F6F2"></circle></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.5px">vaquita</span>
    </a>
    <nav aria-label="Principal" style="display: flex; gap: 4px; flex-wrap: wrap; flex: 1">
      <a href="Panel.dc.html" aria-current="page" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; background: #E3F1EA; color: #14503A; font-weight: 700; text-decoration: none">Panel</a>
      <a href="Grupos.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis suscripciones</a>
      <a href="MisCobros.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis cobros</a>
      <a href="Solicitudes.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #17201C; text-decoration: none">Mis solicitudes</a>
    </nav>
    <a href="Perfil.dc.html" aria-label="Mi perfil: Ana Quispe" style="width: 44px; height: 44px; border-radius: 999px; background: #17201C; color: #F5F6F2; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">AQ</a>
  </header>
  <main style="flex: 1; box-sizing: border-box; width: 100%; max-width: 1180px; margin: 0 auto; padding: 32px 32px 48px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <section aria-labelledby="mes" style="flex: 999 1 620px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DDD7; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <h1 id="mes" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px">Octubre 2026</h1>
        <div style="display: flex; gap: 8px"><button type="button" aria-label="Mes anterior" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #C9CFC8; background: #FFFFFF; color: #17201C; font: inherit; font-weight: 700; cursor: pointer">‹</button><button type="button" aria-label="Mes siguiente" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #C9CFC8; background: #FFFFFF; color: #17201C; font: inherit; font-weight: 700; cursor: pointer">›</button></div>
      </div>
      <div style="display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: #4F5A55">
        <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-weight: 700; color: #1C3F94">◆</span>Fecha de corte</span>
        <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-weight: 700; color: #7A4B00">●</span>Vencimiento</span>
      </div>
      <div role="grid" aria-label="Calendario de octubre 2026" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
          <span role="columnheader" style="font-size: 13px; font-weight: 700; color: #4F5A55; text-align: center; padding: 4px 0">{{w}}</span>
        </sc-for>
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <div role="gridcell" aria-current="{{c.today}}" style="min-height: 86px; border-radius: 10px; padding: 6px; box-sizing: border-box; background: {{c.bg}}; border: {{c.border}}; display: flex; flex-direction: column; gap: 4px; opacity: {{c.opacity}}">
            <span style="font-size: 13px; font-weight: 700">{{c.day}}</span>
            <sc-for list="{{c.events}}" as="e" hint-placeholder-count="0">
              <span style="font-size: 12px; line-height: 1.25; border-radius: 6px; padding: 3px 5px; background: {{e.bg}}; color: {{e.fg}}">{{e.icon}} {{e.text}}</span>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </section>
    <aside aria-labelledby="proximos" style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DDD7; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="proximos" style="margin: 0; font-size: 18px">Próximos 30 días</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
        <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="5">
          <li style="display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #EEF0EC">
            <span style="flex: none; width: 52px; display: flex; flex-direction: column; align-items: center; font-weight: 700"><span style="font-size: 20px">{{u.d}}</span><span style="font-size: 12px; color: #4F5A55">{{u.m}}</span></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">{{u.title}}</strong><span style="font-size: 14px; color: #4F5A55">{{u.detail}}</span></span>
          </li>
        </sc-for>
      </ol>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const corte = (text) => ({ icon: '◆', text, bg: '#DCE6FB', fg: '#1C3F94' });
    const vence = (text) => ({ icon: '●', text, bg: '#FCEBC7', fg: '#5C3900' });
    const ev = {
      1: [corte('Netflix · titular')], 4: [vence('Netflix · miembros')],
      12: [corte('Disney+')], 15: [vence('Disney+ · Bs 22,10')],
      18: [corte('Spotify')], 21: [vence('Spotify · Bs 19,80')]
    };
    const cells = [];
    for (const d of [28, 29, 30]) cells.push({ day: String(d), events: [], bg: '#FAFBF8', border: '1px solid #EEF0EC', opacity: '0.5', today: 'false' });
    for (let d = 1; d <= 31; d++) {
      const today = d === 18;
      cells.push({ day: String(d), events: ev[d] ?? [], bg: today ? '#E3F1EA' : '#FFFFFF', border: today ? '2px solid #1E6B4E' : '1px solid #E6E9E4', opacity: '1', today: today ? 'date' : 'false' });
    }
    cells.push({ day: '1 nov.', events: [corte('Netflix · titular')], bg: '#FAFBF8', border: '1px solid #EEF0EC', opacity: '0.7', today: 'false' });
    return {
      weekdays: ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'],
      cells,
      upcoming: [
        { d: '21', m: 'oct.', title: 'Vence tu cobro de Spotify depa', detail: 'Miembro · Bs 19,80' },
        { d: '1', m: 'nov.', title: 'Corte de Netflix de la familia', detail: 'Titular · cobrarás Bs 76,50 (estimado)' },
        { d: '4', m: 'nov.', title: 'Vencen los cobros de Netflix', detail: 'Titular · 3 miembros' },
        { d: '12', m: 'nov.', title: 'Corte de Disney+ primos', detail: 'Miembro · Bs 22,10 (estimado)' },
        { d: '15', m: 'nov.', title: 'Vence tu cobro de Disney+', detail: 'Miembro · Bs 22,10 (estimado)' }
      ]
    };
  }
}
</script>
</body>
</html>
