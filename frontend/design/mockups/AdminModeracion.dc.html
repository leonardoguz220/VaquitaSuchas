<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vaquita Admin · Moderación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B4E}a:hover{color:#14503A}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F5F6F2; color: #17201C; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="box-sizing: border-box; padding: 14px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; background: #17201C; color: #F5F6F2">
    <a href="AdminPanel.dc.html" style="display: flex; align-items: center; gap: 10px; color: #F5F6F2; text-decoration: none">
      <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="11" fill="#F5F6F2"></rect><path d="M9 11 L18 26 L27 11" fill="none" stroke="#1E6B4E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="25.5" cy="25" r="3.2" fill="#1E6B4E"></circle></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">vaquita <span style="font-size: 14px; font-weight: 600; color: #C5CEC9">admin</span></span>
    </a>
    <nav aria-label="Administración" style="display: flex; gap: 4px; flex-wrap: wrap; flex: 1">
      <a href="AdminUsuarios.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #E6EBE8; text-decoration: none">Usuarios</a>
      <a href="AdminReclamo.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #E6EBE8; text-decoration: none">Reclamos</a>
      <a href="AdminTitulares.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #E6EBE8; text-decoration: none">Titulares</a>
      <a href="AdminAuditoria.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #E6EBE8; text-decoration: none">Auditoría</a>
      <a href="AdminCatalogo.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; color: #E6EBE8; text-decoration: none">Catálogo</a>
      <a href="AdminModeracion.dc.html" aria-current="page" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; background: #2E3A35; color: #FFFFFF; font-weight: 700; text-decoration: none">Moderación</a>
    </nav>
    <span aria-label="Administradora: Camila Fuentes" style="width: 44px; height: 44px; border-radius: 999px; background: #E3F1EA; color: #14503A; display: flex; align-items: center; justify-content: center; font-weight: 700">CF</span>
  </header>
  <main style="flex: 1; box-sizing: border-box; width: 100%; max-width: 1080px; margin: 0 auto; padding: 32px 32px 48px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; letter-spacing: -0.8px">Moderación de cupos libres</h1>
      <p style="margin: 0; font-size: 16px; color: #4F5A55">Con 3 reportes de personas distintas, una publicación se oculta hasta que la revises.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="2">
        <article style="background: #FFFFFF; border: 1px solid #D9DDD7; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
            <strong style="flex: 1; min-width: 220px; font-size: 18px">{{i.title}}</strong>
            <span style="border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 700; background: {{i.bg}}; color: {{i.fg}}">{{i.status}}</span>
          </div>
          <span style="font-size: 15px; color: #4F5A55">{{i.meta}}</span>
          <p style="margin: 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; background: #F5F6F2; border-radius: 12px; padding: 12px 14px">{{i.text}}</p>
          <ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4F5A55; display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{i.reports}}" as="r" hint-placeholder-count="2"><li>{{r}}</li></sc-for>
          </ul>
          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid #1E6B4E; background: #FFFFFF; color: #1E6B4E; font: inherit; font-weight: 700; cursor: pointer">Restaurar</button>
            <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid #E7B6B0; background: #FFFFFF; color: #9B1C12; font: inherit; font-weight: 700; cursor: pointer">Eliminar</button>
            <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #9B1C12; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer">Eliminar y suspender al titular</button>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        {
          title: 'Netflix · Premium · 1 cupo', status: 'Oculta · 3 reportes', bg: '#FBDCD8', fg: '#9B1C12',
          meta: 'Titular: Sofía Mamani · publicada el 10 oct.',
          text: 'Cupo barato, escríbeme por WhatsApp al número de mi perfil para pagar directo.',
          reports: ['Pide pagar fuera del flujo de la solicitud · 16 oct.', 'Posible estafa · 16 oct.', 'Datos de contacto en la descripción · 17 oct.']
        },
        {
          title: 'YouTube Premium · Familiar · 3 cupos', status: 'Visible · 1 reporte', bg: '#FCEBC7', fg: '#7A4B00',
          meta: 'Titular: Marco Vargas · publicada el 2 oct.',
          text: 'Grupo de la familia Vargas. Cobro el día 1, pago por QR.',
          reports: ['Precio distinto al del catálogo · 14 oct.']
        }
      ]
    };
  }
}
</script>
</body>
</html>
